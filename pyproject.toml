[project]
name = "twinline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "plotly",
    "scikit-learn",
    "pandas",
    "pydantic>=2",
    "PyYAML",
    "networkx",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
